<svg width="470" height="195" viewBox="0 0 470 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top languages for shreekanthashokg-lang">
  <defs>
    <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#100a24"/>
    </linearGradient>
    <linearGradient id="langsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="langsClip"><rect width="470" height="195" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#langsClip)">
    <rect width="470" height="195" fill="url(#langsBg)"/>
    <rect x="1" y="1" width="468" height="193" rx="17" fill="none" stroke="url(#langsBorder)" stroke-width="1.4"/>

    <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#e2e8f0">Most Used Languages</text>

    <!-- segmented bar -->
    <g transform="translate(24,50)">
      <rect x="0" y="0" width="422" height="14" rx="7" fill="#1e293b"/>
      <rect x="0" y="0" height="14" rx="7" fill="#3b82f6" width="0">
        <animate attributeName="width" from="0" to="245" dur="1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <rect x="245" y="0" height="14" fill="#f97316" width="0">
        <animate attributeName="width" from="0" to="93" dur="1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <rect x="338" y="0" height="14" fill="#22d3ee" width="0">
        <animate attributeName="width" from="0" to="42" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <rect x="380" y="0" height="14" rx="7" fill="#eab308" width="0">
        <animate attributeName="width" from="0" to="25" dur="1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <rect x="402" y="0" height="14" rx="7" fill="#a855f7" width="0">
        <animate attributeName="width" from="0" to="20" dur="1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </g>

    <!-- legend -->
    <g font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
      <g transform="translate(24,92)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
        <circle cx="4" cy="-4" r="5" fill="#3b82f6"/>
        <text x="16" y="0">Python</text>
        <text x="220" y="0" text-anchor="end" fill="#64748b">58%</text>
      </g>
      <g transform="translate(24,116)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
        <circle cx="4" cy="-4" r="5" fill="#f97316"/>
        <text x="16" y="0">Jupyter Notebook</text>
        <text x="220" y="0" text-anchor="end" fill="#64748b">22%</text>
      </g>
      <g transform="translate(24,140)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
        <circle cx="4" cy="-4" r="5" fill="#22d3ee"/>
        <text x="16" y="0">HTML</text>
        <text x="220" y="0" text-anchor="end" fill="#64748b">10%</text>
      </g>
      <g transform="translate(250,92)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
        <circle cx="4" cy="-4" r="5" fill="#eab308"/>
        <text x="16" y="0">JavaScript</text>
        <text x="196" y="0" text-anchor="end" fill="#64748b">6%</text>
      </g>
      <g transform="translate(250,116)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
        <circle cx="4" cy="-4" r="5" fill="#a855f7"/>
        <text x="16" y="0">CSS</text>
        <text x="196" y="0" text-anchor="end" fill="#64748b">4%</text>
      </g>
    </g>

    <text x="24" y="176" font-family="Consolas, monospace" font-size="10.5" fill="#475569">Composite across public repositories · ML notebooks + production pipelines</text>
  </g>
</svg>
