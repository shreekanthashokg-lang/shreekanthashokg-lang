<svg width="340" height="560" viewBox="0 0 340 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shreekanth A Guttedar ID badge">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#120b28"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#67e8f9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avatarRing" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#0b1224" stop-opacity="0"/>
      <stop offset="86%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="lanyardGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="46"/>
    </clipPath>
  </defs>

  <!-- pivot for pendulum swing: whole assembly rotates around the top anchor -->
  <g transform="translate(170,18)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0;7;-6;4;-3;2;-1;0.5;0"
        keyTimes="0;0.12;0.28;0.44;0.58;0.7;0.8;0.9;1"
        dur="5.5s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate"
        additive="sum"
        values="0;3;-3;0"
        keyTimes="0;0.5;0.9;1"
        dur="6s" begin="5.7s" repeatCount="indefinite"/>

      <!-- clip -->
      <circle cx="0" cy="0" r="7" fill="#1e293b" stroke="url(#cardBorder)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.6" fill="#0b1224"/>

      <!-- strap -->
      <path d="M -9 5 C -9 60, -14 90, -6 140 L 6 140 C 14 90, 9 60, 9 5 Z" fill="url(#strapGrad)" stroke="#0b1224" stroke-width="0.5"/>
      <text x="0" y="45" font-family="Consolas, monospace" font-size="9" fill="#e0f2fe" text-anchor="middle" transform="rotate(90)">SHREEKANTH · AI/ML</text>
      <text x="0" y="90" font-family="Consolas, monospace" font-size="9" fill="#e0f2fe" text-anchor="middle" transform="rotate(90)">SHREEKANTH · AI/ML</text>

      <!-- metal clasp -->
      <g transform="translate(0,142)">
        <rect x="-13" y="0" width="26" height="16" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
        <circle cx="0" cy="18" r="7" fill="none" stroke="#94a3b8" stroke-width="3"/>
      </g>

      <!-- ID card -->
      <g transform="translate(0,158)">
        <rect x="-115" y="0" width="230" height="330" rx="20" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="2"/>
        <rect x="-115" y="0" width="230" height="330" rx="20" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="8"/>

        <!-- header strip -->
        <rect x="-115" y="0" width="230" height="34" rx="20" fill="#0891b2" opacity="0.18"/>
        <text x="0" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#67e8f9">ACCESS · AI/ML</text>

        <!-- avatar -->
        <circle cx="0" cy="98" r="52" fill="url(#avatarRing)">
          <animateTransform attributeName="transform" type="rotate" from="0 0 98" to="360 0 98" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="98" r="47" fill="#0b1224" stroke="#1e293b" stroke-width="2"/>
        <g clip-path="url(#avatarClip)" transform="translate(0,98)">
          <image href="data:image/jpeg;base64," x="-46" y="-46" width="92" height="92" preserveAspectRatio="xMidYMid slice"/>
        </g>

        <!-- name / role -->
        <text x="0" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#f1f5f9">Shreekanth A.</text>
        <text x="0" y="192" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#f1f5f9">Guttedar</text>
        <text x="0" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#a855f7">AI/ML Engineer · Data Scientist</text>
        <text x="0" y="231" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#67e8f9">@shreekanthashokg-lang</text>

        <!-- divider -->
        <line x1="-90" y1="245" x2="90" y2="245" stroke="#1e293b" stroke-width="1.5"/>

        <!-- barcode -->
        <g transform="translate(-90,258)" fill="#94a3b8">
          <rect x="0" y="0" width="2" height="26"/><rect x="4" y="0" width="1" height="26"/><rect x="7" y="0" width="3" height="26"/>
          <rect x="12" y="0" width="1" height="26"/><rect x="15" y="0" width="2" height="26"/><rect x="19" y="0" width="4" height="26"/>
          <rect x="25" y="0" width="1" height="26"/><rect x="28" y="0" width="2" height="26"/><rect x="32" y="0" width="1" height="26"/>
          <rect x="35" y="0" width="3" height="26"/><rect x="40" y="0" width="1" height="26"/><rect x="43" y="0" width="2" height="26"/>
          <rect x="47" y="0" width="4" height="26"/><rect x="53" y="0" width="1" height="26"/><rect x="56" y="0" width="2" height="26"/>
          <rect x="60" y="0" width="1" height="26"/><rect x="63" y="0" width="3" height="26"/><rect x="68" y="0" width="1" height="26"/>
          <rect x="71" y="0" width="2" height="26"/><rect x="75" y="0" width="4" height="26"/><rect x="81" y="0" width="1" height="26"/>
          <rect x="84" y="0" width="2" height="26"/><rect x="88" y="0" width="3" height="26"/><rect x="93" y="0" width="1" height="26"/>
          <rect x="96" y="0" width="2" height="26"/><rect x="100" y="0" width="1" height="26"/><rect x="103" y="0" width="3" height="26"/>
          <rect x="108" y="0" width="2" height="26"/><rect x="112" y="0" width="1" height="26"/><rect x="115" y="0" width="4" height="26"/>
          <rect x="121" y="0" width="1" height="26"/><rect x="124" y="0" width="2" height="26"/><rect x="128" y="0" width="1" height="26"/>
          <rect x="131" y="0" width="3" height="26"/><rect x="136" y="0" width="1" height="26"/><rect x="139" y="0" width="2" height="26"/>
          <rect x="143" y="0" width="4" height="26"/><rect x="149" y="0" width="1" height="26"/><rect x="152" y="0" width="2" height="26"/>
          <rect x="156" y="0" width="3" height="26"/><rect x="161" y="0" width="1" height="26"/><rect x="164" y="0" width="2" height="26"/>
          <rect x="168" y="0" width="1" height="26"/><rect x="171" y="0" width="3" height="26"/><rect x="176" y="0" width="4" height="26"/>
        </g>
        <text x="0" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#475569" letter-spacing="1">ID · 233130168 · BENGALURU-IN</text>

        <!-- holographic shine sweep -->
        <rect x="-115" y="0" width="90" height="330" fill="url(#shineGrad)" transform="skewX(-18)">
          <animateTransform attributeName="transform" type="translate" values="-40,0; 300,0" dur="4s" repeatCount="indefinite" additive="sum"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
