<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trophies for shreekanthashokg-lang">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#100a24"/>
    </linearGradient>
    <linearGradient id="trophyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shineT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="trophyClip"><rect width="900" height="170" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#trophyClip)">
    <rect width="900" height="170" fill="url(#trophyBg)"/>
    <rect x="1" y="1" width="898" height="168" rx="17" fill="none" stroke="url(#trophyBorder)" stroke-width="1.4"/>

    <!-- 5 trophy cells -->
    <!-- Cell template repeated with translate -->
    <g font-family="'Segoe UI', sans-serif">
      <!-- Repositories -->
      <g transform="translate(20,14)" opacity="0">
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0,18;0,0" dur="0.5s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.1s" fill="freeze"/>
        <rect width="160" height="142" rx="14" fill="#0e1a33" stroke="#334155" stroke-width="1"/>
        <circle cx="80" cy="46" r="30" fill="url(#aGlow)"/>
        <text x="80" y="56" text-anchor="middle" font-size="34">📦</text>
        <text x="80" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Repositories</text>
        <text x="80" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#67e8f9">9</text>
        <text x="80" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">A</text>
      </g>

      <!-- Stars -->
      <g transform="translate(196,14)" opacity="0">
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0,18;0,0" dur="0.5s" begin="0.22s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.22s" fill="freeze"/>
        <rect width="160" height="142" rx="14" fill="#0e1a33" stroke="#334155" stroke-width="1"/>
        <circle cx="80" cy="46" r="30" fill="url(#aGlow)"/>
        <text x="80" y="56" text-anchor="middle" font-size="34">⭐</text>
        <text x="80" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Stars Earned</text>
        <text x="80" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#67e8f9">5</text>
        <text x="80" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">A+</text>
      </g>

      <!-- Followers -->
      <g transform="translate(372,14)" opacity="0">
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0,18;0,0" dur="0.5s" begin="0.34s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.34s" fill="freeze"/>
        <rect width="160" height="142" rx="14" fill="#1a1330" stroke="#facc15" stroke-opacity="0.5" stroke-width="1.4"/>
        <circle cx="80" cy="46" r="34" fill="url(#sGlow)"/>
        <text x="80" y="56" text-anchor="middle" font-size="34">👥</text>
        <text x="80" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Followers</text>
        <text x="80" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#fde047">1.1k</text>
        <text x="80" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#facc15">S</text>
      </g>

      <!-- Hackathon -->
      <g transform="translate(548,14)" opacity="0">
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0,18;0,0" dur="0.5s" begin="0.46s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.46s" fill="freeze"/>
        <rect width="160" height="142" rx="14" fill="#1a1330" stroke="#facc15" stroke-opacity="0.5" stroke-width="1.4"/>
        <circle cx="80" cy="46" r="34" fill="url(#sGlow)"/>
        <text x="80" y="56" text-anchor="middle" font-size="34">🏆</text>
        <text x="80" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">eMudhra 2026</text>
        <text x="80" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#fde047">1st</text>
        <text x="80" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#facc15">S</text>
      </g>

      <!-- Experience -->
      <g transform="translate(724,14)" opacity="0">
        <animateTransform attributeName="transform" additive="sum" type="translate" values="0,18;0,0" dur="0.5s" begin="0.58s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.58s" fill="freeze"/>
        <rect width="160" height="142" rx="14" fill="#0e1a33" stroke="#334155" stroke-width="1"/>
        <circle cx="80" cy="46" r="30" fill="url(#aGlow)"/>
        <text x="80" y="56" text-anchor="middle" font-size="34">🧬</text>
        <text x="80" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Bio + AI Fusion</text>
        <text x="80" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#67e8f9">MCA</text>
        <text x="80" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#22d3ee">A</text>
      </g>
    </g>

    <!-- shine sweep across the whole card -->
    <rect x="-200" y="0" width="120" height="170" fill="url(#shineT)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="-100,0; 1100,0" dur="4.5s" begin="1s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
</svg>
